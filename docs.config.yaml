title: bluecadet docs
repoUrl: https://github.com/bluecadet/docs
favicon: docs/favicon.svg

landing: docs/index.mdx

content:
  # base: docs so routes are /reference/cli/, not /docs/reference/cli/.
  - base: docs
    files: "**/*.{md,mdx,astro}"
    assets: "**/*.cast"
  - base: packages
    files: "*/README.md"
    route: packages

header:
  links:
    - label: github
      href: https://github.com/bluecadet/docs
    - label: package
      href: https://www.npmjs.com/package/@bluecadet/docs

sidebar:
  - label: Tutorials
    items:
      - tutorials/add-docs-to-your-repo
  - label: How-to
    items:
      - how-to/configure-docs-config-yaml
      - how-to/include-package-readmes-from-a-monorepo
      - how-to/build-a-rich-landing-page
  - label: Reference
    items:
      - reference/cli
      - reference/docs-config-yaml
      - reference/content-conventions
      - reference/search
      - reference/astro-page-demo
  - label: Explanation
    items:
      - explanation/architecture

footer:
  groups:
    - title: docs
      links:
        - label: add docs to your repo
          href: /tutorials/add-docs-to-your-repo
        - label: cli reference
          href: /reference/cli
        - label: configuration
          href: /reference/docs-config-yaml
        - label: search
          href: /reference/search
    - title: project
      links:
        - label: github
          href: https://github.com/bluecadet/docs
        - label: package
          href: https://www.npmjs.com/package/@bluecadet/docs
        - label: issues
          href: https://github.com/bluecadet/docs/issues
        - label: releases
          href: https://github.com/bluecadet/docs/releases
    - title: from the same shop
      links:
        - label: preflight
          href: https://github.com/bluecadet/preflight
          note: github.com/bluecadet/preflight
        - label: launchpad
          href: https://github.com/bluecadet/launchpad
          note: github.com/bluecadet/launchpad
  meta: builds to static files
