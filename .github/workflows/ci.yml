# CI for the monorepo: lint, build the CLI, run each workspace's tests (if any), and a smoke
# build of this repo's own docs (using the workspace CLI, not the published package — the same
# "workspace" build path docs.yml uses) as an integration test that catches breakage before it
# reaches main/release.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build @bluecadet/docs
        run: npm run build --workspace packages/docs

      - name: Test
        run: npm test --workspaces --if-present

      - name: Smoke build this repo's own docs (workspace CLI, no deploy)
        run: node packages/docs/dist/cli.js build --out ./dist

  # Regression guard for a shipped tarball missing files the app needs at build time (e.g. the
  # published package.json's "files" whitelist dropping a directory the app imports): every other
  # job here dogfoods the *workspace* CLI, which runs straight from the repo tree and never
  # notices a "files" gap. This job packs the real tarball, installs it into a scratch npm project
  # with no relation to this repo, and runs the CLI's build against a throwaway fixture repo — the
  # same path a real consumer hits with `npx @bluecadet/docs build`.
  package-install-smoke:
    name: Package install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pack @bluecadet/docs
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --workspace packages/docs --pack-destination "$RUNNER_TEMP/pack"

      - name: Write a minimal fixture repo
        run: |
          mkdir -p "$RUNNER_TEMP/fixture/docs/img" "$RUNNER_TEMP/fixture/packages/widget"
          # The config is the whole content contract — nothing is discovered by convention — so this
          # exercises both entry forms: a bare glob string (base "." , so its directory stays in the
          # route) and object entries with base/route/assets, one of them pointing outside the docs
          # tree entirely.
          cat > "$RUNNER_TEMP/fixture/docs.config.yaml" <<'EOF'
          title: Fixture Repo
          landing: docs/index.md
          content:
            - "CHANGELOG.md"
            - base: docs
              files: "**/*.{md,mdx,astro}"
              assets: "img/**/*"
            - base: packages
              files: "*/README.md"
              route: packages
              assets: "**/*.svg"
          EOF
          cat > "$RUNNER_TEMP/fixture/CHANGELOG.md" <<'EOF'
          # Changelog

          Published by a bare string entry, so its path relative to the config file *is* its route.
          EOF
          cat > "$RUNNER_TEMP/fixture/docs/index.md" <<'EOF'
          # Fixture Repo

          Minimal fixture repo for smoke-testing the packed @bluecadet/docs tarball.

          ![a diagram](../packages/widget/diagram.svg)
          EOF
          cat > "$RUNNER_TEMP/fixture/packages/widget/README.md" <<'EOF'
          # Widget Package

          Fixture package README, published under the `packages` route prefix.
          EOF
          printf '%s\n' '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1"></svg>' \
            > "$RUNNER_TEMP/fixture/packages/widget/diagram.svg"
          printf '%s\n' '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2 2"></svg>' \
            > "$RUNNER_TEMP/fixture/docs/img/logo.svg"
          cat > "$RUNNER_TEMP/fixture/docs/getting-started.md" <<'EOF'
          # Getting Started

          Fixture page with a little prose so the build has something to render.

          ![the logo](./img/logo.svg)
          EOF
          cat > "$RUNNER_TEMP/fixture/docs/component-demo.astro" <<'EOF'
          ---
          import { Ok } from "@bluecadet/docs/components";

          export const layout = "docs";
          export const title = "Component Demo";
          ---

          <p>Fixture <code>.astro</code> page in the docs layout. <Ok>this word</Ok> comes from the barrel.</p>
          EOF
          cat > "$RUNNER_TEMP/fixture/docs/component-demo-raw.astro" <<'EOF'
          ---
          export const layout = "raw";
          ---

          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Raw Fixture Page</title>
            </head>
            <body>
              <p>Fixture raw page — owns its whole document, outside the docs chrome.</p>
            </body>
          </html>
          EOF
          cat > "$RUNNER_TEMP/fixture/docs/mdx-demo.mdx" <<'EOF'
          ---
          title: MDX Demo
          ---

          import { Ok } from "@bluecadet/docs/components";

          Fixture MDX page importing a component from the barrel: <Ok>this word</Ok>.
          EOF

      - name: Install the packed tarball into a scratch project
        run: |
          mkdir -p "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install"
          npm init -y
          npm install "$RUNNER_TEMP"/pack/bluecadet-docs-*.tgz

      - name: Build the fixture repo from the installed tarball
        run: |
          cd "$RUNNER_TEMP/install"
          npx docs build --config "$RUNNER_TEMP/fixture/docs.config.yaml" --out "$RUNNER_TEMP/fixture-dist"

      - name: Verify build output
        run: |
          test -f "$RUNNER_TEMP/fixture-dist/index.html"
          test -f "$RUNNER_TEMP/fixture-dist/getting-started/index.html"
          test -f "$RUNNER_TEMP/fixture-dist/pagefind/pagefind.js"

          # `landing:` owns "/", and its relative image resolves to the single path the packages
          # entry's `assets` glob published it at — under that entry's `route` prefix.
          grep -q 'src="/packages/widget/diagram.svg"' "$RUNNER_TEMP/fixture-dist/index.html"
          test -f "$RUNNER_TEMP/fixture-dist/packages/widget/diagram.svg"

          # An entry with no `route` publishes its assets at the site root instead.
          grep -q 'src="/img/logo.svg"' "$RUNNER_TEMP/fixture-dist/getting-started/index.html"
          test -f "$RUNNER_TEMP/fixture-dist/img/logo.svg"

          # Bare string entry: base is ".", so the file's own directory stays in the route.
          test -f "$RUNNER_TEMP/fixture-dist/changelog/index.html"

          # Object-form entry: base outside the docs tree, published under its `route` prefix, with
          # the README basename collapsed onto its directory.
          test -f "$RUNNER_TEMP/fixture-dist/packages/widget/index.html"
          grep -q 'Widget Package' "$RUNNER_TEMP/fixture-dist/packages/widget/index.html"

          # Nothing the `assets` globs didn't name reaches the output — no blind directory sweep.
          if [ -f "$RUNNER_TEMP/fixture-dist/packages/widget/README.md" ]; then
            echo "README.md shipped as a raw asset — pages are published as pages, not downloads" >&2
            exit 1
          fi

          # .astro page via a content glob, layout "docs": renders in the normal chrome with its title.
          test -f "$RUNNER_TEMP/fixture-dist/component-demo/index.html"
          grep -q 'class="sidebar-rail"' "$RUNNER_TEMP/fixture-dist/component-demo/index.html"
          grep -q 'Component Demo' "$RUNNER_TEMP/fixture-dist/component-demo/index.html"

          # .astro page, layout "raw": owns its whole document, no docs chrome.
          test -f "$RUNNER_TEMP/fixture-dist/component-demo-raw/index.html"
          grep -q 'Raw Fixture Page' "$RUNNER_TEMP/fixture-dist/component-demo-raw/index.html"
          if grep -q 'class="sidebar-rail"' "$RUNNER_TEMP/fixture-dist/component-demo-raw/index.html"; then
            echo "raw page rendered the docs chrome — layout: \"raw\" should own its whole document" >&2
            exit 1
          fi

          # .mdx page importing a barrel component: the component's own markup rendered.
          test -f "$RUNNER_TEMP/fixture-dist/mdx-demo/index.html"
          grep -q 'class="ok"' "$RUNNER_TEMP/fixture-dist/mdx-demo/index.html"

      # A landing page is optional. With no `landing:`, "/" must still resolve — it becomes a
      # meta-refresh to the first page in the sidebar, so the site has no dead entry point.
      - name: Build the same fixture with no landing page
        run: |
          cd "$RUNNER_TEMP/install"
          # Same docs entry as above, with `landing:` removed — that key is the only difference.
          cat > "$RUNNER_TEMP/fixture/docs.config.yaml" <<'EOF'
          title: Fixture Repo
          content:
            - base: docs
              files: "**/*.{md,mdx,astro}"
              assets: "img/**/*"
          EOF
          rm "$RUNNER_TEMP/fixture/docs/index.md"
          npx docs build --config "$RUNNER_TEMP/fixture/docs.config.yaml" --out "$RUNNER_TEMP/no-landing-dist"

      - name: Verify the no-landing redirect
        run: |
          test -f "$RUNNER_TEMP/no-landing-dist/index.html"
          grep -q 'http-equiv="refresh"' "$RUNNER_TEMP/no-landing-dist/index.html"
          # The target is the first sidebar page (alphabetical in auto mode), not a hardcoded route.
          grep -q 'url=/component-demo/' "$RUNNER_TEMP/no-landing-dist/index.html"
          test -f "$RUNNER_TEMP/no-landing-dist/getting-started/index.html"
