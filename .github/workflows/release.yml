# Changesets version/publish flow for @bluecadet/docs.
#
# Publishes to the GitHub Packages npm registry (npm.pkg.github.com), not public npmjs.com.
# GitHub Packages doesn't support npm trusted publishing/OIDC or provenance, so auth is the
# job's own GITHUB_TOKEN (needs `packages: write`) instead of an OIDC exchange. setup-node's
# registry-url + scope config points `@bluecadet` installs/publishes at GitHub Packages while
# leaving unscoped transitive deps resolving from the default npm registry.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - ".changeset/**"

permissions: {}
jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'bluecadet/docs'

    permissions:
      contents: write # to create release (changesets/action)
      packages: write # to publish @bluecadet/docs to GitHub Packages
      pull-requests: write # to create pull request (changesets/action)

    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@bluecadet"
          package-manager-cache: false # never use caching in release builds

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish to GitHub Packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          # setup-node's registry-url config reads this at publish time to auth against
          # npm.pkg.github.com for the @bluecadet scope.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
