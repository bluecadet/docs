# Changesets version/publish flow for @bluecadet/docs.
#
# Publishes to the public npm registry (registry.npmjs.org) using npm trusted
# publishing: the job exchanges its GitHub OIDC token for a short-lived npm
# credential, so there is no NPM_TOKEN secret to store or rotate. This requires
# `id-token: write` and a trusted publisher configured on npmjs.com for the
# package (Settings -> Trusted publishing -> this repo + workflow file).
#
# NPM_CONFIG_PROVENANCE makes npm attach a signed provenance attestation linking
# each published tarball to this workflow and commit. Note that attestations are
# public even though this repo is private: they expose the repo URL, workflow
# path, and commit SHA. Drop the env var if that is unwanted.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - ".changeset/**"

permissions: {}
jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'bluecadet/docs'

    permissions:
      contents: write # to create release (changesets/action)
      id-token: write # to mint the OIDC token for npm trusted publishing
      pull-requests: write # to create pull request (changesets/action)

    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          # trusted publishing needs npm >= 11.5.1; node 24 bundles npm 11.x
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          scope: "@bluecadet"
          package-manager-cache: false # never use caching in release builds

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          NPM_CONFIG_PROVENANCE: true
