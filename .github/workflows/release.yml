# Changesets version/publish flow for @bluecadet/docs and @bluecadet/docs-theme, mirroring
# bluecadet/launchpad's release.yml.
#
# Assumes npm Trusted Publishing (OIDC) is configured for both packages on npmjs.com, linked to
# this repo — same convention launchpad uses. No NPM_TOKEN secret is needed: `id-token: write`
# lets `npm run release` (changesets publish -> npm publish) exchange the job's OIDC token for
# provenance/publish access.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - ".changeset/**"

permissions: {}
jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'bluecadet/docs'

    permissions:
      contents: write # to create release (changesets/action)
      id-token: write # OpenID Connect token needed for provenance
      pull-requests: write # to create pull request (changesets/action)

    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
